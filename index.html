<style>
  :root{
    --charcoal:#17181A;
    --panel:#211F1C;
    --panel-raised:#28251F;
    --steel:#3B3733;
    --safety:#00E5FF;
    --safety-dim:#0A7A8C;
    --spotter:#FF2E9A;
    --paper:#F3EFE6;
    --muted:#948E82;
    --radius:14px;
    --font-display:'Bebas Neue', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--charcoal);
    color:var(--paper);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:1100px;
    margin:0 auto;
    padding:max(28px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(80px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  /* ---------- Login (multiusuário via Firebase) ---------- */
  #loginGate{
    position:fixed;inset:0;
    background:var(--charcoal);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
    overflow-y:auto;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--steel);
    border-radius:var(--radius);
    padding:28px 24px;
  }
  .login-card h1{
    font-family:var(--font-display);
    font-size:32px;
    letter-spacing:.01em;
    margin:4px 0 20px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:28px;
    padding-bottom:20px;
    border-bottom:2px solid var(--steel);
  }
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}

  .account-menu-wrap{position:relative;}
  .account-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--panel);
    border:1px solid var(--steel);
    border-radius:10px;
    min-width:190px;
    padding:6px;
    box-shadow:0 10px 28px rgba(0,0,0,.45);
    z-index:20;
  }
  .account-menu-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--paper);
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:500;
    padding:10px 12px;
    border-radius:7px;
    cursor:pointer;
  }
  .account-menu-item:hover{background:var(--panel-raised);}
  .account-menu-item-danger{color:var(--spotter);}
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--safety);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:var(--font-display);
    font-size:44px;
    letter-spacing:.02em;
    margin:0;
    line-height:.95;
  }
  .subtitle{color:var(--muted);font-size:13.5px;margin-top:6px;}
  .section-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin:4px 0 18px;
    padding-bottom:16px;
    border-bottom:2px solid var(--steel);
  }
  .section-heading h2{
    font-family:var(--font-display);
    font-size:24px;
    letter-spacing:.01em;
    margin:0;
    color:var(--paper);
  }
  .section-heading .section-heading-hint{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted);
    letter-spacing:.02em;
    margin-top:4px;
  }
  .btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:10px;
    padding:13px 20px;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--safety);color:#1a1a1a;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--paper);border:1.5px solid var(--steel);}
  .btn-ghost:hover{border-color:var(--muted);}
  .btn-danger{background:transparent;color:var(--spotter);border:1.5px solid rgba(228,87,46,.4);}
  .btn-danger:hover{background:rgba(228,87,46,.1);}

  /* ---------- Category groups ---------- */
  .category-group{margin-bottom:34px;}
  .category-header{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    margin-bottom:16px;
    padding:0 0 10px;
    border:none;
    border-bottom:1.5px solid var(--steel);
    background:none;
    cursor:pointer;
    text-align:left;
    font:inherit;
    color:inherit;
  }
  .category-header:hover h2{color:var(--safety);}
  .category-header:hover .chevron{border-color:var(--muted);}
  .chevron{
    flex-shrink:0;
    width:22px;height:22px;
    border-radius:6px;
    border:1.5px solid var(--steel);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease, border-color .15s ease;
  }
  .chevron svg{width:12px;height:12px;stroke:var(--safety);transition:transform .15s ease;}
  .chevron.collapsed svg{transform:rotate(-90deg);}
  .category-header h2{
    font-family:var(--font-display);
    font-size:26px;
    letter-spacing:.03em;
    margin:0;
    color:var(--paper);
    transition:color .15s ease;
  }
  .category-count{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    margin-left:auto;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:18px;
  }

  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--steel);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .card::before, .card::after{
    content:'';
    position:absolute;
    width:7px;height:7px;
    border-radius:50%;
    background:#151412;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.6), 0 0 0 1.5px var(--steel);
    z-index:3;
  }
  .card::before{top:10px;left:10px;}
  .card::after{top:10px;right:10px;}

  .card-photo{
    width:100%;
    aspect-ratio:4/3;
    background:linear-gradient(135deg,#2b2823,#1c1a17);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .card-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-photo .placeholder{color:var(--steel);}
  .card-photo svg{width:44px;height:44px;stroke:var(--muted);opacity:.5;}

  .tag{
    position:absolute;
    bottom:10px;
    left:10px;
    background:var(--safety);
    color:#1a1a1a;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    padding:4px 9px;
    border-radius:5px;
    z-index:2;
  }

  .card-body{
    padding:16px 16px 14px;
    display:flex;
    flex-direction:column;
    gap:10px;
    flex:1;
  }
  .card-name{
    font-family:var(--font-display);
    font-size:22px;
    letter-spacing:.01em;
    line-height:1;
  }
  .category-pill{

  .checkpoint-history-btn{
    flex-shrink:0;

    border:1.5px solid var(--steel);

  /* ---------- Empty / Loading ---------- */
  .empty{
    text-align:center;
    padding:70px 20px;

    border-radius:var(--radius);
  }

  .empty p{margin:0 0 18px;font-size:14.5px;}
  .loading{text-align:center;padding:60px 0;color:var(--muted);font-family:var(--font-mono);font-size:13px;}

  .error-banner{
    background:rgba(228,87,46,.12);
    border:1px solid rgba(228,87,46,.4);
    color:#f0a488;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    margin-bottom:18px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,9,8,.72);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:30px 16px;
    overflow-y:auto;
    z-index:10;

  .modal{
    background:var(--panel);

    display:block;

  .field input[type="password"],

  .field textarea{

  .modal-actions{

  }
  .modal-actions .btn{flex:1;}

  /* ---------- Personalize modal ---------- */
  .modal-wide{max-width:600px;}

  .swatch-preview-font{

    border:1px solid var(--steel);
  }
  .swatch-label{
    width:100%;
    font-size:10px;
    letter-spacing:.02em;
    color:var(--muted);
    text-align:center;
    line-height:1.2;
    font-family:var(--font-body);
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .swatch.selected .swatch-label{color:var(--paper);}

  /* ---------- Install modal ---------- */
  .install-steps{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    counter-reset:step;
  }
  .install-steps li{
    counter-increment:step;
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:12px 0;

    line-height:1.5;
  }
  .install-steps li:last-child{border-bottom:none;}
  .install-steps li span{
    flex:1;
    min-width:0;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  .install-steps li::before{
    content:counter(step);
    flex-shrink:0;
    width:24px;height:24px;
    margin-top:1px;
    border-radius:50%;
    background:var(--safety);
    color:#1a1a1a;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .install-steps b{color:var(--paper);}
  .install-note{
    font-size:13px;
    color:var(--muted);
    line-height:1.55;
    margin:0 0 20px;
    overflow-wrap:break-word;
    word-break:break-word;
  }

  @media (max-width:480px){

    .modal{padding:18px;}
    .modal h2{font-size:24px;margin-bottom:14px;}
    .install-steps li{font-size:13.5px;gap:10px;padding:11px 0;}
    .install-steps li::before{width:22px;height:22px;font-size:11px;}
    .install-note{font-size:12.5px;}
    .modal-wide{max-width:100%;}
    .section-title{font-size:10.5px;margin-bottom:8px;}
    .swatch-grid{grid-template-columns:repeat(auto-fill, minmax(64px,1fr));gap:7px;margin-bottom:20px;}
    .swatch{padding:6px 4px;gap:5px;}
    .swatch-preview-color,
    .swatch-preview-font,
    .swatch-preview-wallpaper{height:26px;}
    .swatch-preview-font{font-size:15px;}
    .swatch-label{font-size:8.5px;line-height:1.15;}

    .swatch-preview-font,
    .swatch-preview-wallpaper{height:22px;}
    .swatch-preview-font{font-size:14px;}
    .swatch-label{font-size:8.5px;line-height:1.15;}
  }

  /* ---------- Check-in ---------- */
  .frequency-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:20px;
    margin-bottom:28px;
  }
  .checkin-panel{
    background:var(--panel);

  .checkin-main{
    display:flex;

    line-height:1.1;
  }
  .checkin-status .checkin-time{color:var(--safety);}
  .checkin-main .btn{white-space:nowrap;}
  .checkin-stats{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .checkin-stat{
    flex:1 1 76px;
    background:var(--panel-raised);
    border:1px solid var(--steel);
    border-radius:9px;
    padding:12px 8px;
    text-align:center;
  }
  .checkin-stat-value{
    font-family:var(--font-mono);
    font-weight:700;
    font-size:22px;
    color:var(--safety);
    line-height:1;
  }
  .checkin-stat-label{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-top:5px;
  }
  .checkin-history-link{
    background:none;
    border:none;
    color:var(--muted);

    font-family:var(--font-body);
    cursor:pointer;
    padding:0;
    text-decoration:underline;

  .checkin-history-link:hover{color:var(--paper);}

  .period-tabs{

    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--muted);
    cursor:pointer;
    text-align:center;
    transition:border-color .15s ease, color .15s ease;

  .period-tab:hover{color:var(--paper);}

  .bioimp-list{max-height:56vh;overflow-y:auto;margin-bottom:18px;padding-right:2px;}

    border-radius:10px;

  .invite-code-value{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:700;

    color:var(--safety);

  .invite-code-label{

  .checkin-history-body{max-height:52vh;overflow-y:auto;margin-bottom:20px;padding-right:2px;}

  }
  .checkin-delete-btn{
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;

    padding:4px 2px;

    flex-shrink:0;
  }

  @media (max-width:480px){
    .checkin-main{flex-direction:column;align-items:stretch;text-align:left;}
    .checkin-main .btn{width:100%;}
  }
</style>

  </div>

  <div class="frequency-grid">

      </div>
      <div class="checkin-stats" id="checkinStats"></div>

    </div>

    <div class="checkin-panel">

/* ---------- CPF: formatação, validação e conversão para login no Firebase ---------- */
function onlyDigits(str){
  return (str || '').replace(/\D/g, '');
}

function formatCpfInput(value){
  const d = onlyDigits(value).slice(0, 11);
  let out = d;
  if(d.length > 9) out = d.slice(0,3) + '.' + d.slice(3,6) + '.' + d.slice(6,9) + '-' + d.slice(9);
  else if(d.length > 6) out = d.slice(0,3) + '.' + d.slice(3,6) + '.' + d.slice(6);
  else if(d.length > 3) out = d.slice(0,3) + '.' + d.slice(3);
  return out;
}

function isValidCPF(cpf){
  const d = onlyDigits(cpf);
  if(d.length !== 11) return false;
  if(/^(\d)\1{10}$/.test(d)) return false;
  let sum = 0;
  for(let i = 0; i < 9; i++) sum += parseInt(d[i], 10) * (10 - i);
  let check1 = 11 - (sum % 11);
  if(check1 >= 10) check1 = 0;
  if(check1 !== parseInt(d[9], 10)) return false;
  sum = 0;
  for(let i = 0; i < 10; i++) sum += parseInt(d[i], 10) * (11 - i);
  let check2 = 11 - (sum % 11);
  if(check2 >= 10) check2 = 0;
  if(check2 !== parseInt(d[10], 10)) return false;
  return true;
}

function cpfToAuthEmail(cpf){
  return 'cpf' + onlyDigits(cpf) + '@academiavipi.local';
}

function attachCpfMask(inputEl){
  inputEl.addEventListener('input', () => {
    const pos = inputEl.selectionStart;
    const before = inputEl.value.length;
    inputEl.value = formatCpfInput(inputEl.value);
    const after = inputEl.value.length;
    inputEl.selectionStart = inputEl.selectionEnd = Math.max(0, pos + (after - before));
  });
}

function createFirestoreStorage(uid){
  const col = fbDb.collection('users').doc(uid).collection('data');
  return {
    async list(prefix){
      const snap = await col.where('key', '>=', prefix).where('key', '<', prefix + '\uf8ff').get();
      return { keys: snap.docs.map(d => d.data().key) };
    },
    async get(key){
      const doc = await col.doc(key).get();
      if(!doc.exists) throw new Error('chave não encontrada');
      return { key, value: doc.data().value };
    },
    async set(key, value){
      await col.doc(key).set({ key, value });
      return { key, value };
    },
    async delete(key){
      await col.doc(key).delete();
      return { key, deleted: true };
    }
  };
}

// Camada de armazenamento local com três níveis, do mais para o menos persistente:
// 1) window.storage — quando a ficha roda dentro do Claude (nuvem, entre sessões e aparelhos)
// 2) IndexedDB — quando a ficha roda como app instalado/aberto direto no navegador do celular
// 3) memória — último recurso, se nenhum dos dois acima estiver disponível
// (Se firebaseConfigured for verdadeiro, nada disso é usado: o Firestore assume no lugar,
// com os dados isolados por usuário logado — ver initApp() no final do arquivo.)
const memoryStore = {};
const memoryStorage = {
  async list(prefix){
    return { keys: Object.keys(memoryStore).filter(k => k.startsWith(prefix)) };
  },
  async get(key){
    if(!(key in memoryStore)) throw new Error('chave não encontrada');
    return { key, value: memoryStore[key] };
  },
  async set(key, value){
    memoryStore[key] = value;
    return { key, value };
  },
  async delete(key){
    delete memoryStore[key];
    return { key, deleted: true };
  }
};

function openIndexedDB(){
  return new Promise((resolve, reject) => {
    if(!window.indexedDB){ reject(new Error('IndexedDB indisponível neste navegador')); return; }
    const req = indexedDB.open('ficha-maquinas-db', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if(!db.objectStoreNames.contains('kv')){
        db.createObjectStore('kv', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('Falha ao abrir o IndexedDB'));
  });
}

function createIndexedDBStorage(db){
  return {
    list(prefix){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').getAllKeys();
        req.onsuccess = () => resolve({ keys: req.result.filter(k => typeof k === 'string' && k.startsWith(prefix || '')) });
        req.onerror = () => reject(req.error);
      });
    },
    get(key){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = () => req.result ? resolve({ key, value: req.result.value }) : reject(new Error('chave não encontrada'));
        req.onerror = () => reject(req.error);
      });
    },
    set(key, value){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        const req = tx.objectStore('kv').put({ key, value });
        req.onsuccess = () => resolve({ key, value });
        req.onerror = () => reject(req.error);
      });
    },
    delete(key){
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        const req = tx.objectStore('kv').delete(key);
        req.onsuccess = () => resolve({ key, deleted: true });
        req.onerror = () => reject(req.error);
      });
    }
  };
}

/* ---------- Check-in de frequência ---------- */
const CHECKIN_PREFIX = 'checkin:';
let checkins = [];

function todayDateStr(d = new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatTimeStr(d){
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function formatDateLabel(dateStr){
  const [y, m, d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}

function getWeekRange(d = new Date()){
  // semana comecando na segunda-feira
  const dayIndex = (d.getDay() + 6) % 7; // 0 = segunda ... 6 = domingo
  const monday = new Date(d);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(d.getDate() - dayIndex);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { start: monday, end: sunday };
}

async function loadCheckins(){
  try{
    const listResult = await storageAPI.list(CHECKIN_PREFIX, false);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const items = [];
    for(const key of keys){
      try{
        const res = await storageAPI.get(key, false);
        if(res && res.value) items.push(JSON.parse(res.value));
      }catch(e){ /* ignora chave ilegível */ }
    }
    items.sort((a, b) => b.timestamp - a.timestamp);
    checkins = items;
  }catch(e){
    checkins = [];
  }
  renderCheckinPanel();
}

function getTodayCheckins(){
  const today = todayDateStr();
  return checkins.filter(c => c.date === today).sort((a, b) => a.timestamp - b.timestamp);
}

function computeCheckinStats(){
  const now = new Date();
  const { start: weekStart, end: weekEnd } = getWeekRange(now);
  const uniqueDates = new Set(checkins.map(c => c.date));

  let weekCount = 0, monthCount = 0, yearCount = 0;
  uniqueDates.forEach(dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    if(d >= weekStart && d <= weekEnd) weekCount++;
    if(d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) monthCount++;
    if(d.getFullYear() === now.getFullYear()) yearCount++;
  });

  let streak = 0;
  const cursor = new Date(now);
  cursor.setHours(0, 0, 0, 0);
  if(!uniqueDates.has(todayDateStr(cursor))){
    cursor.setDate(cursor.getDate() - 1);
  }
  while(uniqueDates.has(todayDateStr(cursor))){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  return { weekCount, monthCount, yearCount, streak };
}

function renderCheckinPanel(){
  const statusEl = document.getElementById('checkinStatus');
  const statsEl = document.getElementById('checkinStats');
  const btn = document.getElementById('btnCheckin');
  if(!statusEl || !statsEl || !btn) return;

  const todayEntries = getTodayCheckins();
  const stats = computeCheckinStats();

  if(todayEntries.length === 0){
    statusEl.textContent = 'Você ainda não fez check-in hoje';
  }else if(todayEntries.length === 1){
    statusEl.innerHTML = `Check-in feito hoje às <span class="checkin-time">${escapeHtml(todayEntries[0].time)}</span>`;
  }else{
    const lastTime = todayEntries[todayEntries.length - 1].time;
    statusEl.innerHTML = `${todayEntries.length} check-ins hoje · último às <span class="checkin-time">${escapeHtml(lastTime)}</span>`;
  }
  btn.textContent = 'Fazer Check-in';
  btn.className = 'btn btn-primary';

  statsEl.innerHTML = `
    <div class="checkin-stat"><div class="checkin-stat-value">${stats.weekCount}</div><div class="checkin-stat-label">Semana</div></div>
    <div class="checkin-stat"><div class="checkin-stat-value">${stats.monthCount}</div><div class="checkin-stat-label">Mês</div></div>
    <div class="checkin-stat"><div class="checkin-stat-value">${stats.yearCount}</div><div class="checkin-stat-label">Ano</div></div>
    <div class="checkin-stat"><div class="checkin-stat-value">${stats.streak}</div><div class="checkin-stat-label">Sequência</div></div>
  `;
}

/* ---------- Exercícios aeróbicos ---------- */
const AEROBIC_PREFIX = 'aerobic:';
let aerobicEntries = [];
let currentAerobicPeriod = 'day';

function isDateInPeriod(dateStr, period){
  const d = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  if(period === 'day') return dateStr === todayDateStr(now);
  if(period === 'week'){
    const { start, end } = getWeekRange(now);
    return d >= start && d <= end;
  }
  if(period === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  if(period === 'year') return d.getFullYear() === now.getFullYear();
  return false;
}

function formatMinutesLabel(totalMinutes){
  const m = Math.round(totalMinutes);
  if(m < 60) return `${m}min`;
  const h = Math.floor(m / 60);
  const rem = m % 60;
  return `${h}h${String(rem).padStart(2, '0')}`;
}

async function loadAerobicEntries(){
  try{
    const listResult = await storageAPI.list(AEROBIC_PREFIX, false);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const items = [];
    for(const key of keys){
      try{
        const res = await storageAPI.get(key, false);
        if(res && res.value) items.push(JSON.parse(res.value));
      }catch(e){ /* ignora chave ilegível */ }
    }
    items.sort((a, b) => b.timestamp - a.timestamp);
    aerobicEntries = items;
  }catch(e){
    aerobicEntries = [];
  }
  renderAerobicPanel();
}

function computeAerobicStats(period){
  let minutes = 0, km = 0, kcal = 0;
  aerobicEntries.forEach(entry => {
    if(isDateInPeriod(entry.date, period)){
      minutes += Number(entry.minutes) || 0;
      km += Number(entry.km) || 0;
      kcal += Number(entry.kcal) || 0;
    }
  });
  return { minutes, km, kcal };
}

function renderAerobicPanel(){
  const statusEl = document.getElementById('aerobicStatus');
  const statsEl = document.getElementById('aerobicStats');
  if(!statusEl || !statsEl) return;

  const todayCount = aerobicEntries.filter(e => e.date === todayDateStr()).length;
  statusEl.textContent = todayCount === 0
    ? 'Nenhum treino aeróbico hoje'
    : `${todayCount} treino${todayCount === 1 ? '' : 's'} aeróbico${todayCount === 1 ? '' : 's'} hoje`;

  const stats = computeAerobicStats(currentAerobicPeriod);
  statsEl.innerHTML = `
    <div class="checkin-stat"><div class="checkin-stat-value">${escapeHtml(formatMinutesLabel(stats.minutes))}</div><div class="checkin-stat-label">Tempo</div></div>
    <div class="checkin-stat"><div class="checkin-stat-value">${stats.km.toFixed(1)}</div><div class="checkin-stat-label">Km</div></div>
    <div class="checkin-stat"><div class="checkin-stat-value">${Math.round(stats.kcal)}</div><div class="checkin-stat-label">Kcal</div></div>
  `;
}

/* ---------- Competição Saudável (multiusuário, exige Firebase configurado) ---------- */
// Pontuação: cada dia com check-in vale 10 pontos (cobre qualquer atividade feita na
// academia, incluindo musculação); cada minuto de atividade aeróbica vale 1 ponto
// (corrida, natação, bike... qualquer tipo — "qualquer movimento pontua").
const COMPETITION_POINTS_PER_CHECKIN_DAY = 10;
const COMPETITION_POINTS_PER_AEROBIC_MINUTE = 1;

function generateInviteCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem caracteres ambíguos (0/O, 1/I)
  let code = '';
  for(let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

function computeMyWeekPoints(){
  const now = new Date();
  const { start, end } = getWeekRange(now);
  const inWeek = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    return d >= start && d <= end;
  };
  const checkinDays = new Set(checkins.filter(c => inWeek(c.date)).map(c => c.date)).size;
  const aerobicMinutes = aerobicEntries
    .filter(e => inWeek(e.date))
    .reduce((sum, e) => sum + (Number(e.minutes) || 0), 0);
  const points = checkinDays * COMPETITION_POINTS_PER_CHECKIN_DAY + Math.round(aerobicMinutes * COMPETITION_POINTS_PER_AEROBIC_MINUTE);
  return { points, checkinDays, aerobicMinutes: Math.round(aerobicMinutes) };
}

}

      const groupIds = Array.isArray(profile.groups) ? profile.groups : [];
      groupIds.push(groupRef.id);
      await updateMyGroupIds(groupIds);
      closeModal();
      openCompetitionModal();
    }catch(e){
      errorEl.innerHTML = `<div class="field-error">Não foi possível criar o grupo: ${escapeHtml(e && e.message ? e.message : 'erro desconhecido')}</div>`;
    }
  };

  document.getElementById('btnJoinGroup').onclick = async () => {
    const code = document.getElementById('joinGroupCode').value.trim().toUpperCase();
    const nickname = document.getElementById('joinGroupNickname').value.trim();
    const errorEl = document.getElementById('competitionFormError');
    if(!code || !nickname){
      errorEl.innerHTML = `<div class="field-error">Preencha o código do grupo e o seu apelido.</div>`;
      return;
    }
    try{
      const snap = await fbDb.collection('groups').where('inviteCode', '==', code).limit(1).get();
      if(snap.empty){
        errorEl.innerHTML = `<div class="field-error">Nenhum grupo encontrado com esse código. Confira e tente de novo.</div>`;
        return;
      }
      const groupId = snap.docs[0].id;
      await syncMyPointsToGroup(groupId, nickname);
      const profile = await getMyProfile();
      const groupIds = Array.isArray(profile.groups) ? profile.groups : [];
      if(!groupIds.includes(groupId)) groupIds.push(groupId);
      await updateMyGroupIds(groupIds);
      closeModal();
      openCompetitionModal();
    }catch(e){
      errorEl.innerHTML = `<div class="field-error">Não foi possível entrar no grupo: ${escapeHtml(e && e.message ? e.message : 'erro desconhecido')}</div>`;
    }
  };
}

async function renderCompetitionGroupView(groupIds, activeGroupId){
  const modal = document.querySelector('#overlay .modal');
  modal.innerHTML = `<h2>Competição Saudável</h2><p class="competition-intro">Carregando ranking…</p>`;

  try{
    await syncMyPointsToGroup(activeGroupId, null);

    const groupDoc = await fbDb.collection('groups').doc(activeGroupId).get();
    const groupData = groupDoc.exists ? groupDoc.data() : { name: 'Grupo', inviteCode: '------' };
    const membersSnap = await fbDb.collection('groups').doc(activeGroupId).collection('members').get();
    const members = membersSnap.docs.map(d => ({ uid: d.id, ...d.data() }))
      .sort((a, b) => (b.points || 0) - (a.points || 0));

    const selectHtml = groupIds.length > 1
      ? `<div class="group-select-wrap">
          <select id="groupSwitcher">
            ${groupIds.map(gid => `<option value="${escapeHtml(gid)}" ${gid === activeGroupId ? 'selected' : ''}>${gid === activeGroupId ? escapeHtml(groupData.name) : 'Carregando...'}</option>`).join('')}
          </select>
        </div>`
      : '';

    const rankHtml = members.length === 0
      ? `<p class="install-note">Nenhum participante ainda.</p>`
      : members.map((m, idx) => `
          <li class="leaderboard-item ${m.uid === currentUserUid ? 'is-me' : ''}">
            <span class="leaderboard-rank">${idx + 1}º</span>
            <span class="leaderboard-name">${escapeHtml(m.displayName || 'Sem apelido')}${m.uid === currentUserUid ? ' (você)' : ''}</span>
            <span class="leaderboard-points">${m.points || 0} pts</span>
          </li>`).join('');

    modal.innerHTML = `
      <h2>${escapeHtml(groupData.name)}</h2>
      ${selectHtml}
      <div class="invite-code-box">
        <div>
          <div class="invite-code-label">Código de convite</div>
          <div class="invite-code-value" id="inviteCodeValue">${escapeHtml(groupData.inviteCode)}</div>
        </div>
        <button type="button" class="btn btn-ghost" id="btnCopyInvite" style="padding:9px 14px;font-size:12.5px;">Copiar</button>
      </div>
      <div class="points-legend">Pontuação semanal: ${COMPETITION_POINTS_PER_CHECKIN_DAY} pts por dia com check-in + ${COMPETITION_POINTS_PER_AEROBIC_MINUTE} pt por minuto de atividade aeróbica. Qualquer tipo de treino vale — musculação, corrida, natação e outros.</div>
      <ul class="leaderboard-list">${rankHtml}</ul>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnLeaveGroup">Sair do grupo</button>
        <button type="button" class="btn btn-primary" id="btnCloseCompetition">Fechar</button>
      </div>
      <button type="button" class="checkin-history-link" id="btnAddAnotherGroup" style="display:block;margin-top:14px;">+ Criar ou entrar em outro grupo</button>
    `;

    document.getElementById('btnCloseCompetition').onclick = closeModal;
    document.getElementById('btnCopyInvite').onclick = async () => {
      try{
        await navigator.clipboard.writeText(groupData.inviteCode);
        const btn = document.getElementById('btnCopyInvite');
        btn.textContent = 'Copiado!';
        setTimeout(() => { btn.textContent = 'Copiar'; }, 1500);
      }catch(e){ /* clipboard indisponível; código já está visível na tela */ }
    };
    document.getElementById('btnAddAnotherGroup').onclick = () => {
      closeModal();
      renderCompetitionNoGroupStandalone();
    };
    document.getElementById('btnLeaveGroup').onclick = () => {
      openConfirmModal('Sair deste grupo? Você deixa de ver o ranking e os outros deixam de ver seus pontos.', async () => {
        try{
          await fbDb.collection('groups').doc(activeGroupId).collection('members').doc(currentUserUid).delete();
          const profile = await getMyProfile();
          const remaining = (Array.isArray(profile.groups) ? profile.groups : []).filter(g => g !== activeGroupId);
          await updateMyGroupIds(remaining);
          closeModal();
          openCompetitionModal();
        }catch(e){
          showError('Não foi possível sair do grupo: ' + (e && e.message ? e.message : 'erro desconhecido'));
        }
      });
    };
    if(groupIds.length > 1){
      document.getElementById('groupSwitcher').onchange = (e) => {
        renderCompetitionGroupView(groupIds, e.target.value);
      };
    }
  }catch(e){
    modal.innerHTML = `
      <h2>Competição Saudável</h2>
      <p class="competition-intro">Não foi possível carregar o ranking: ${escapeHtml(e && e.message ? e.message : 'erro desconhecido')}</p>

function generateAppIcon(size, safetyColor){
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#17181A';
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = safetyColor;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.08;
  const points = [
    [0.12, 0.55], [0.30, 0.55], [0.38, 0.32],
    [0.48, 0.74], [0.58, 0.28], [0.66, 0.55], [0.88, 0.55]
  ].map(([fx, fy]) => [fx * size, fy * size]);
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for(let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.stroke();
  return canvas.toDataURL('image/png');
}

function updateAppManifestAndIcon(safetyColor){
  // Envolvido em try/catch: se o navegador do celular bloquear canvas/Blob (comum em
  // navegadores embutidos de apps como WhatsApp/Instagram), o app continua funcionando
  // normalmente com o ícone e o manifest estáticos já definidos no <head>.
  try{
    const icon192 = generateAppIcon(192, safetyColor);
    const icon512 = generateAppIcon(512, safetyColor);

    const manifest = {
      name: 'Academia ViPi',
      short_name: 'Academia ViPi',
      description: 'Catálogo de máquinas de academia com fotos, séries, repetições e peso.',
      display: 'standalone',
      background_color: '#17181A',
      theme_color: '#17181A',
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    const manifestUrl = URL.createObjectURL(blob);

    const manifestLink = document.getElementById('manifestLink');
    if(manifestLink) manifestLink.href = manifestUrl;

    const faviconLink = document.getElementById('faviconLink');
    if(faviconLink) faviconLink.href = icon192;

    const appleTouchIconLink = document.getElementById('appleTouchIconLink');
    if(appleTouchIconLink) appleTouchIconLink.href = icon192;
  }catch(e){
    console.warn('Não foi possível gerar o ícone personalizado; mantendo o ícone padrão.', e);
  }
}

function applySettings(settings){
  const color = COLORS.find(c => c.id === settings.colorId) || COLORS[0];
  const font = FONTS.find(f => f.id === settings.fontId) || FONTS[0];
  const wallpaper = WALLPAPERS.find(w => w.id === settings.wallpaperId) || WALLPAPERS[0];

  const root = document.documentElement.style;
  root.setProperty('--safety', color.safety);
  root.setProperty('--spotter', color.spotter);
  root.setProperty('--font-display', font.display);
  root.setProperty('--font-body', font.body);
  root.setProperty('--font-mono', font.mono);

  document.body.style.backgroundImage = wallpaper.image;
  document.body.style.backgroundSize = wallpaper.size || 'auto';

  updateAppManifestAndIcon(color.safety);
}

async function loadEquipment(){
  contentEl.innerHTML = '<div class="loading">Carregando equipamentos…</div>';
  if(storageMode === 'memory'){
    errorBannerEl.innerHTML = `<div class="error-banner">Não foi possível salvar os dados de forma permanente neste navegador — o que for cadastrado agora ficará disponível apenas durante esta sessão.</div>`;
  }
  try{
    const listResult = await storageAPI.list(PREFIX, false);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const items = [];
    for(const key of keys){
      try{
        const res = await storageAPI.get(key, false);
        if(res && res.value){
          items.push(JSON.parse(res.value));
        }
      }catch(e){ /* skip unreadable key */ }
    }
    items.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
    equipmentList = items;
    render();
  }catch(e){
    contentEl.innerHTML = '';
    showError('Não foi possível carregar os equipamentos: ' + (e && e.message ? e.message : 'erro desconhecido'));
  }
}

        ${iconEmpty}
        <p>Nenhum equipamento cadastrado ainda.<br>Adicione a primeira máquina da sua ficha.</p>
        <button class="btn btn-primary" onclick="openModal()">+ Novo Equipamento</button>
      </div>`;
    return;
  }
  const groups = {};
  for(const item of equipmentList){
    const cat = item.category && item.category.trim() ? item.category : OTHER_CATEGORY;
    if(!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  }
  const orderedCats = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }));
  if(hintEl){
    const catCount = orderedCats.length;
    hintEl.textContent = `${equipmentList.length} equipamento${equipmentList.length === 1 ? '' : 's'} · ${catCount} grupo${catCount === 1 ? '' : 's'}`;
  }

  contentEl.innerHTML = orderedCats.map(cat => {
    const isCollapsed = !expandedCategories.has(cat);
    return `
    <div class="category-group">
      <button type="button" class="category-header" data-category="${escapeHtml(cat)}" aria-expanded="${!isCollapsed}">
        <span class="chevron ${isCollapsed ? 'collapsed' : ''}">${iconChevron}</span>
        <h2>${escapeHtml(cat)}</h2>
        <span class="category-count">${groups[cat].length} equipamento${groups[cat].length === 1 ? '' : 's'}</span>
      </button>
      ${isCollapsed ? '' : `<div class="grid">${groups[cat].map(cardTemplate).join('')}</div>`}
    </div>
  `;
  }).join('');

  contentEl.querySelectorAll('.category-header').forEach(header => {
    header.addEventListener('click', () => {
      const cat = header.dataset.category;
      if(expandedCategories.has(cat)) expandedCategories.delete(cat);
      else expandedCategories.add(cat);
      render();
    });
  });

  contentEl.querySelectorAll('[data-checkpoint-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleEquipmentCheckpoint(btn.dataset.checkpointId);
    });
  });
  contentEl.querySelectorAll('[data-checkpoint-history-id]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openEquipmentCheckpointHistory(btn.dataset.checkpointHistoryId, btn.dataset.checkpointHistoryName);
    });
  });
}

/* ---------- Checkpoint diário do exercício ---------- */
// Marca se um equipamento foi "feito" no dia de hoje. A marcação vale só para o
// dia atual (reseta na virada da meia-noite, já que a checagem é sempre contra a
// data de hoje), mas cada marcação fica registrada no histórico permanentemente.
const EQCHECK_PREFIX = 'eqcheck:';
let equipmentCheckpoints = [];

async function loadEquipmentCheckpoints(){
  try{
    const listResult = await storageAPI.list(EQCHECK_PREFIX, false);
    const keys = (listResult && listResult.keys) ? listResult.keys : [];
    const items = [];
    for(const key of keys){
      try{
        const res = await storageAPI.get(key, false);
        if(res && res.value) items.push(JSON.parse(res.value));
      }catch(e){ /* ignora chave ilegível */ }
    }
    items.sort((a, b) => b.timestamp - a.timestamp);
    equipmentCheckpoints = items;
  }catch(e){
    equipmentCheckpoints = [];
  }
}

function isEquipmentCheckedToday(equipmentId){
  const today = todayDateStr();
  return equipmentCheckpoints.some(c => c.equipmentId === equipmentId && c.date === today);
}

async function toggleEquipmentCheckpoint(equipmentId){
  const today = todayDateStr();
  const existing = equipmentCheckpoints.find(c => c.equipmentId === equipmentId && c.date === today);

  if(existing){
    openConfirmModal('Desmarcar este exercício como feito hoje?', async () => {
      try{
        await storageAPI.delete(EQCHECK_PREFIX + existing.id, false);
        await loadEquipmentCheckpoints();
        render();
      }catch(e){
        showError('Não foi possível desmarcar: ' + (e && e.message ? e.message : 'erro desconhecido'));
      }
    });
    return;
  }

  const now = new Date();
  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
    equipmentId,
    date: today,
    time: formatTimeStr(now),
    timestamp: now.getTime()
  };
  try{
    await storageAPI.set(EQCHECK_PREFIX + entry.id, JSON.stringify(entry), false);
    await loadEquipmentCheckpoints();
    render();
  }catch(e){
    showError('Não foi possível marcar como feito: ' + (e && e.message ? e.message : 'erro desconhecido'));
  }
}

function openEquipmentCheckpointHistory(equipmentId, equipmentName){
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const entries = equipmentCheckpoints.filter(c => c.equipmentId === equipmentId);
  const grouped = {};
  entries.forEach(entry => {
    const key = entry.date.slice(0, 7);
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(entry);
  });
  const monthKeys = Object.keys(grouped).sort().reverse();

  const bodyHtml = monthKeys.length === 0
    ? `<p class="install-note">Nenhuma marcação registrada ainda para este exercício.</p>`
    : monthKeys.map(key => {
        const [y, m] = key.split('-');
        const label = `${monthNames[parseInt(m, 10) - 1]} de ${y}`;
        const monthEntries = grouped[key].sort((a, b) => b.timestamp - a.timestamp);
        return `
          <p class="section-title">${escapeHtml(label)} · ${monthEntries.length} marcação${monthEntries.length === 1 ? '' : 'ões'}</p>
          <ul class="checkin-history-list">
            ${monthEntries.map(e => `
              <li>
                <span>${escapeHtml(formatDateLabel(e.date))}</span>
                <span class="checkin-history-time">${escapeHtml(e.time)}</span>
                <button type="button" class="checkin-delete-btn" data-eqcheck-delete-id="${escapeHtml(e.id)}" title="Excluir marcação">✕</button>
              </li>`).join('')}
          </ul>`;
      }).join('');

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'overlay';
  overlay.innerHTML = `
    <div class="modal modal-wide">
      <h2>Histórico · ${escapeHtml(equipmentName)}</h2>
      <div class="checkin-history-body">${bodyHtml}</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="btnCloseEqCheckHistory" style="flex:none;width:100%;">Fechar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) closeModal(); };
  document.getElementById('btnCloseEqCheckHistory').onclick = closeModal;
  overlay.querySelectorAll('[data-eqcheck-delete-id]').forEach(delBtn => {
    delBtn.onclick = () => {
      openConfirmModal('Excluir esta marcação do histórico?', async () => {
        try{
          await storageAPI.delete(EQCHECK_PREFIX + delBtn.dataset.eqcheckDeleteId, false);
          await loadEquipmentCheckpoints();
          closeModal();
          openEquipmentCheckpointHistory(equipmentId, equipmentName);
          render();
        }catch(e){
          showError('Não foi possível excluir a marcação: ' + (e && e.message ? e.message : 'erro desconhecido'));
        }
      });
    };
  });
}

function blobToResizedDataUrl(blob, maxW, quality){
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = function(){
      try{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      }catch(err){
        reject(err);
      }finally{
        URL.revokeObjectURL(objectUrl);
      }
    };
    img.onerror = function(){
      URL.revokeObjectURL(objectUrl);
      reject(new Error('Não foi possível processar a imagem'));
    };
    img.src = objectUrl;
  });
}

async function handlePhotoInput(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await blobToResizedDataUrl(file, 640, 0.72);
    photoDataUrl = dataUrl;
    document.getElementById('photoPreview').innerHTML = `<img src="${dataUrl}">`;
  }catch(err){
    showError('Não foi possível carregar essa foto. Tente outra imagem.');
  }
}

async function handleSave(e){
  e.preventDefault();
  const name = document.getElementById('fieldName').value.trim();
  const machineId = document.getElementById('fieldMachineId').value.trim();
  const category = document.getElementById('fieldCategory').value.trim();
  const sets = document.getElementById('fieldSets').value.trim();
  const reps = document.getElementById('fieldReps').value.trim();
  const weight = document.getElementById('fieldWeight').value.trim();
  const videoLink = document.getElementById('fieldVideoLink').value.trim();
  const notes = document.getElementById('fieldNotes').value.trim();
  const errorEl = document.getElementById('formError');

  if(!name || !machineId){
    errorEl.innerHTML = `<div class="field-error">Preencha ao menos o nome e o número de identificação.</div>`;
    return;
  }
  if(videoLink && !/^https?:\/\//i.test(videoLink)){
    errorEl.innerHTML = `<div class="field-error">O link precisa começar com http:// ou https:// (cole o endereço completo do vídeo).</div>`;
    return;
  }

  const saveBtn = document.getElementById('btnSave');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Salvando…';

  const id = editingId || (Date.now() + '-' + Math.random().toString(36).slice(2,8));
  const data = {
    id, name, machineId, category, sets, reps, weight, videoLink, notes,
    photo: photoDataUrl,
    createdAt: editingId ? (equipmentList.find(x=>x.id===editingId)?.createdAt || Date.now()) : Date.now()
  };

  try{
    const result = await storageAPI.set(PREFIX + id, JSON.stringify(data), false);
    if(!result){
      throw new Error('resposta vazia do armazenamento');
    }
    closeModal();
    await loadEquipment();
  }catch(err){
    console.error('Erro ao salvar equipamento:', err);
    errorEl.innerHTML = `<div class="field-error">Erro ao salvar: ${escapeHtml(err && err.message ? err.message : 'erro desconhecido')}</div>`;
    saveBtn.disabled = false;
    saveBtn.textContent = 'Salvar';
  }
}

      await loadEquipment();
    }catch(e){
      showError('Não foi possível excluir: ' + (e && e.message ? e.message : 'erro desconhecido'));
    }
  });
}

  await loadCheckins();
  await loadAerobicEntries();
  await loadBioimpEntries();
  await loadEquipmentCheckpoints();
  await loadEquipment();
}
